<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Wayfare — Login</title>

        <link rel="stylesheet" href="../css/login.css">
</head>

<body>

    <div class="login-container">

        <!-- WAYFARE LOGO -->

        <div class="logo">
            <h1>Wayfare</h1>

            <p>Travel thoughtfully</p>
        </div>


        <!-- LOGIN TITLE -->

        <h2>Welcome Back</h2>


        <!-- MESSAGE -->

        <div id="message" class="message"></div>


        <!-- LOGIN FORM -->

        <form id="loginForm">

            <!-- EMAIL -->

            <div class="input-group">

                <label for="email">
                    Email
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                    required
                >

            </div>


            <!-- PASSWORD -->

            <div class="input-group">

                <label for="password">
                    Password
                </label>

                <div class="password-box">

                    <input
                        type="password"
                        id="password"
                        placeholder="Enter your password"
                        required
                    >

                    <button
                        type="button"
                        class="show-password"
                        onclick="togglePassword()"
                    >
                        Show
                    </button>

                </div>

            </div>


            <!-- OPTIONS -->

            <div class="options">

                <label>

                    <input
                        type="checkbox"
                        id="remember"
                    >

                    Remember me

                </label>


                <a
                    href="#"
                    onclick="forgotPassword()"
                >
                    Forgot password?
                </a>

            </div>


            <!-- LOGIN -->

            <button
                type="submit"
                class="login-btn"
            >
                Login
            </button>

        </form>


        <!-- DIVIDER -->

        <div class="divider">
            OR
        </div>


        <!-- SIGN UP -->

        <div class="signup">

            Don't have an account?

            <a href="register.html">
                Create Account
                
            </a>

         </div>

    </div>


        <script src="../js/login.js"></script>

</body>
</html>
